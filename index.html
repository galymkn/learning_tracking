<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Час учёбы</title>
<meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1016" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Учёба">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<style>
/* Layout: one narrow column, phone-first — date + progress ring on top, topic rows as big tap targets, 14-day strip below */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --fg:#151823; --muted:#646A7E; --line:#DADDE8;
  --accent:#3D5AFE; --accent-soft:#E3E8FF; --done:#1E9E6A; --done-soft:#DDF3E9; --danger:#C2412D;
  --f-display:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1016; --surface:#171A23; --fg:#ECEEF5; --muted:#8C92A6; --line:#262A36;
  --accent:#7C8FFF; --accent-soft:#232A4D; --done:#3CC98C; --done-soft:#16352A; --danger:#F07A64; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1016; --surface:#171A23; --fg:#ECEEF5; --muted:#8C92A6; --line:#262A36;
  --accent:#7C8FFF; --accent-soft:#232A4D; --done:#3CC98C; --done-soft:#16352A; --danger:#F07A64; color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(40px,env(safe-area-inset-bottom));background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-inline:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

header{display:flex;align-items:center;justify-content:space-between;gap:16px}
.date small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.date h1{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
.ring{position:relative;width:84px;height:84px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease,stroke .3s}
.ring.full .bar{stroke:var(--done)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}

.status{font-size:15px;color:var(--muted);margin-top:-8px}
.status b{color:var(--fg);font-weight:600}

.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.item{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;user-select:none;transition:background .2s,border-color .2s}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;transition:all .2s}
.box svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transform:scale(.6);transition:all .2s}
.item .name{flex:1;min-width:0;font-size:17px;font-weight:500;overflow-wrap:anywhere}
.item .at{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.item.on{background:var(--done-soft);border-color:transparent}
.item.on .box{background:var(--done);border-color:var(--done)}
.item.on .box svg{opacity:1;transform:none}
.item.on .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}

.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

/* edit mode */
.erow{display:flex;gap:8px;align-items:center}
.erow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.erow input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:20px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn:disabled:hover{color:var(--muted);border-color:var(--line)}

.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:15px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section h2{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:5px}
.day{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--line);position:relative}
.day.part{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.all{background:var(--done)}
.day.today{outline:2px solid var(--fg);outline-offset:1px}
.legend{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.streak{font-size:15px;margin-top:12px}
.streak b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.hint{font-size:13px;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="date">
      <small id="weekday">понедельник</small>
      <h1 id="today">12 октября</h1>
    </div>
    <div class="ring" id="ring" aria-hidden="true">
      <svg viewBox="0 0 84 84"><circle class="track" cx="42" cy="42" r="36"/><circle class="bar" id="bar" cx="42" cy="42" r="36"/></svg>
      <div class="num" id="num">0/4</div>
    </div>
  </header>
  <div class="status" id="status">Осталось: <b>4 темы</b></div>

  <div id="view">
    <ul class="list" id="list"></ul>
  </div>

  <div id="edit" hidden>
    <div class="list" id="elist"></div>
    <div class="erow" style="margin-top:10px">
      <input id="newTopic" type="text" placeholder="Новая тема, например «Статистика»" maxlength="60" autocomplete="off">
      <button class="icon-btn" id="addBtn" aria-label="Добавить тему" style="color:var(--accent)">+</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="editBtn">Изменить темы</button>
  </div>

  <section>
    <h2>Последние 14 дней</h2>
    <div class="strip" id="strip"></div>
    <div class="legend"><span id="from">—</span><span>сегодня</span></div>
    <div class="streak" id="streak"></div>
  </section>

  <p class="hint">Отметки сбрасываются каждый день в полночь, темы остаются. Данные хранятся только на этом устройстве.</p>
</div>

<script>
(function(){
  const KEY = "daily-study-v1";
  const DEFAULT = { topics:["Reinforcement Learning","Machine Learning","Математика","Чтение статей"], log:{} };
  // log: { "YYYY-MM-DD": { done:{topic:"HH:MM"}, total:N } }

  let state = load();
  let editing = false;

  function load(){
    try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.topics)) return {topics:s.topics, log:s.log||{}}; }catch(e){}
    return JSON.parse(JSON.stringify(DEFAULT));
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  const pad = n => String(n).padStart(2,"0");
  const dayKey = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  let currentDay = dayKey(new Date());

  function todayEntry(){
    const k = dayKey(new Date());
    if(!state.log[k]) state.log[k] = {done:{}, total:state.topics.length};
    state.log[k].total = state.topics.length;
    return state.log[k];
  }
  function prune(){
    const keys = Object.keys(state.log).sort();
    while(keys.length > 60) delete state.log[keys.shift()];
  }

  const MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
  const WD = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
  const plural = (n, a, b, c) => { const m10=n%10, m100=n%100; return (m10===1&&m100!==11)?a:(m10>=2&&m10<=4&&(m100<12||m100>14))?b:c; };

  const $ = id => document.getElementById(id);
  const C = 2*Math.PI*36;
  $("bar").style.strokeDasharray = C;

  function render(){
    const now = new Date();
    $("weekday").textContent = WD[now.getDay()];
    $("today").textContent = now.getDate()+" "+MONTHS[now.getMonth()];

    const e = todayEntry();
    // drop marks for topics that no longer exist
    Object.keys(e.done).forEach(t=>{ if(!state.topics.includes(t)) delete e.done[t]; });
    const total = state.topics.length, done = state.topics.filter(t=>e.done[t]).length, left = total-done;

    $("num").textContent = done+"/"+total;
    $("bar").style.strokeDashoffset = total ? C*(1-done/total) : C;
    $("ring").classList.toggle("full", total>0 && left===0);
    $("status").innerHTML = total===0 ? "Добавьте темы, чтобы начать"
      : left===0 ? "<b>Всё закрыто на сегодня.</b> Хорошая работа."
      : "Осталось: <b>"+left+" "+plural(left,"тема","темы","тем")+"</b>";

    const list = $("list"); list.innerHTML = "";
    if(!total){ list.innerHTML = '<li class="empty">Пока нет тем. Нажмите «Изменить темы».</li>'; }
    state.topics.forEach(t=>{
      const li = document.createElement("li");
      li.className = "item"+(e.done[t]?" on":"");
      li.tabIndex = 0; li.setAttribute("role","checkbox"); li.setAttribute("aria-checked", !!e.done[t]);
      li.innerHTML = '<span class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span><span class="name"></span><span class="at"></span>';
      li.querySelector(".name").textContent = t;
      li.querySelector(".at").textContent = e.done[t] || "";
      const toggle = ()=>{
        if(e.done[t]) delete e.done[t]; else { const d=new Date(); e.done[t]=pad(d.getHours())+":"+pad(d.getMinutes()); }
        save(); render();
      };
      li.addEventListener("click", toggle);
      li.addEventListener("keydown", ev=>{ if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); toggle(); }});
      list.appendChild(li);
    });

    renderHistory();
  }

  function renderHistory(){
    const strip = $("strip"); strip.innerHTML = "";
    const now = new Date();
    let first;
    for(let i=13;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
      if(i===13) first = d;
      const k = dayKey(d), e = state.log[k];
      const n = e ? Object.keys(e.done).length : 0, tot = e ? e.total : 0;
      const el = document.createElement("div");
      el.className = "day"+(tot&&n>=tot?" all":n>0?" part":"")+(i===0?" today":"");
      el.title = d.getDate()+" "+MONTHS[d.getMonth()]+": "+(e?n+"/"+tot:"нет отметок");
      strip.appendChild(el);
    }
    $("from").textContent = first.getDate()+" "+MONTHS[first.getMonth()].slice(0,3);

    // streak: consecutive fully-done days, ending today (or yesterday if today not finished yet)
    let streak = 0, i = 0;
    const isAll = d => { const e = state.log[dayKey(d)]; return e && e.total>0 && Object.keys(e.done).length>=e.total; };
    if(!isAll(now)) i = 1;
    while(true){
      const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
      if(isAll(d)){ streak++; i++; } else break;
    }
    $("streak").innerHTML = streak ? "Серия: <b>"+streak+"</b> "+plural(streak,"день","дня","дней")+" подряд всё закрыто" : "Закройте все темы за день, чтобы начать серию";
  }

  function renderEdit(){
    const el = $("elist"); el.innerHTML = "";
    state.topics.forEach((t,idx)=>{
      const row = document.createElement("div"); row.className = "erow";
      const inp = document.createElement("input"); inp.type="text"; inp.value=t; inp.maxLength=60; inp.id="topic-"+idx;
      inp.setAttribute("aria-label","Тема "+(idx+1));
      inp.addEventListener("change", ()=>{
        const v = inp.value.trim(); if(!v || (v!==t && state.topics.includes(v))){ inp.value=t; return; }
        const e = todayEntry(); if(e.done[t]){ e.done[v]=e.done[t]; delete e.done[t]; }
        state.topics[idx]=v; save(); renderEdit();
      });
      const up = document.createElement("button"); up.className="icon-btn"; up.textContent="↑"; up.setAttribute("aria-label","Выше"); up.disabled = idx===0;
      up.addEventListener("click", ()=>{ const a=state.topics; [a[idx-1],a[idx]]=[a[idx],a[idx-1]]; save(); renderEdit(); });
      const del = document.createElement("button"); del.className="icon-btn"; del.textContent="×"; del.setAttribute("aria-label","Удалить «"+t+"»");
      del.addEventListener("click", ()=>{ state.topics.splice(idx,1); save(); renderEdit(); });
      row.append(inp, up, del); el.appendChild(row);
    });
  }

  function addTopic(){
    const inp = $("newTopic"), v = inp.value.trim();
    if(!v || state.topics.includes(v)) return;
    state.topics.push(v); inp.value=""; save(); renderEdit(); inp.focus();
  }
  $("addBtn").addEventListener("click", addTopic);
  $("newTopic").addEventListener("keydown", e=>{ if(e.key==="Enter") addTopic(); });

  $("editBtn").addEventListener("click", ()=>{
    editing = !editing;
    $("view").hidden = editing; $("edit").hidden = !editing;
    $("editBtn").textContent = editing ? "Готово" : "Изменить темы";
    $("editBtn").classList.toggle("primary", editing);
    if(editing) renderEdit(); else { const v=$("newTopic").value.trim(); if(v) addTopic(); render(); }
  });

  // new day check: on focus/visibility and every 30s
  function checkDay(){ const k = dayKey(new Date()); if(k!==currentDay){ currentDay=k; prune(); save(); if(!editing) render(); } }
  document.addEventListener("visibilitychange", checkDay);
  window.addEventListener("focus", checkDay);
  setInterval(checkDay, 30000);

  prune(); render();
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
})();
</script>

</body>
</html>
